name: Publish to npm

# Publishes a v* tag to npm. The tag is the single source of truth for the
# published version: the "Set version from tag" step writes it into
# package.json before publishing, so the npm version always matches the tag.
#
# Triggered three ways:
#   - workflow_call: release.yml calls this after it tags + creates the GitHub
#     Release, so publishing happens inside the release run (the reliable path).
#   - workflow_dispatch: manually publish a specific existing tag (recovery /
#     re-publish escape hatch).
#   - release [created]: a release made by hand in the GitHub UI still auto-
#     publishes. (Releases created by release.yml run under GITHUB_TOKEN, which
#     by design does NOT fire this event — that's why release.yml calls us
#     directly via workflow_call instead of relying on it.)
#
# Authentication is npm trusted publishing (OIDC) — no NPM_TOKEN. The registry
# mints short-lived credentials from the run's own OIDC identity, so there is no
# long-lived write token to leak or rotate.
#
# IMPORTANT: npm validates the *entry-point* workflow, not the workflow that
# actually runs `npm publish`. Because release.yml calls this file via
# workflow_call, the run's entry point is release.yml — so the Trusted Publisher
# on npmjs.com must be configured against **release.yml**, not publish.yml.
# Both workflows need `id-token: write` (release.yml grants it on its publish
# job; this file grants it below).
#
# Consequence: the workflow_dispatch and release-created triggers above make
# this file the entry point, which will NOT match that Trusted Publisher
# configuration and so cannot authenticate. Recover a failed publish by
# dispatching release.yml instead — it detects that npm is behind the newest
# tag and republishes it without needing new commits.
#
# Requires npm >= 11.5.1 (OIDC support), hence the Node 24 runtime and the
# explicit npm upgrade below.

on:
  workflow_call:
    inputs:
      tag:
        description: "The v* tag to publish (e.g. v1.1.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "The v* tag to publish (e.g. v1.1.0)"
        required: true
        type: string
  release:
    types: [created]

permissions:
  contents: read
  id-token: write # Required for OIDC trusted publishing (and provenance)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Resolve the tag from whichever trigger fired.
      - name: Resolve tag
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${RELEASE_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag to publish (neither a release tag nor an input tag was provided)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Check out the tag's exact commit (not the branch head).
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      # Node 24 and no dependency cache, per npm's trusted-publishing guidance
      # for release builds. Note this is the runtime that *builds* the package;
      # the package's own supported range stays package.json's engines field.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # Node 24 already ships npm 11.x, but pin the floor explicitly: OIDC
      # publishing silently falls back to token auth on npm < 11.5.1, which
      # would fail here with a misleading 404 now that no token exists.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          NPM_VERSION=$(npm --version)
          echo "::notice::npm $NPM_VERSION"
          if [ "$(printf '%s\n' "11.5.1" "$NPM_VERSION" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $NPM_VERSION is older than the 11.5.1 required for trusted publishing."
            exit 1
          fi

      # Catch a missing `id-token: write` grant here, with a message that names
      # the cause, rather than as an opaque auth failure at publish time.
      - name: Verify OIDC is available
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::No OIDC token endpoint — this job lacks 'id-token: write'. A caller job must grant it explicitly; it is not inherited."
            exit 1
          fi
          echo "::notice::OIDC token endpoint available."

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a vX.Y.Z semantic version."
            exit 1
          fi
          # Write the tag's version into package.json (no commit, no git tag).
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN: npm detects the OIDC environment and authenticates
      # with it. No --provenance either — trusted publishing attaches provenance
      # by default.
      - name: Publish to npm
        run: npm publish --access public

      # npm points at ~/.npm/_logs/*.log on failure, but the runner is destroyed
      # with the job, so that path is unreadable by the time anyone looks. Keep
      # the log as an artifact instead. Tokens are redacted in these logs, and
      # Actions masks secrets in artifacts, but the collection step still greps
      # out any authToken line as a belt-and-braces measure.
      - name: Upload npm debug log
        if: failure()
        run: |
          mkdir -p "${{ runner.temp }}/npm-logs"
          if compgen -G "$HOME/.npm/_logs/*.log" > /dev/null; then
            for f in "$HOME"/.npm/_logs/*.log; do
              grep -v -i "authToken" "$f" > "${{ runner.temp }}/npm-logs/$(basename "$f")" || true
            done
          else
            echo "No npm debug logs were written." > "${{ runner.temp }}/npm-logs/none.txt"
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: npm-debug-log
          path: ${{ runner.temp }}/npm-logs
          retention-days: 14
