name: Publish to npm

# Publishes a v* tag to npm. The tag is the single source of truth for the
# published version: the "Set version from tag" step writes it into
# package.json before publishing, so the npm version always matches the tag.
#
# Triggered three ways:
#   - workflow_call: release.yml calls this after it tags + creates the GitHub
#     Release, so publishing happens inside the release run (the reliable path).
#   - workflow_dispatch: manually publish a specific existing tag (recovery /
#     re-publish escape hatch).
#   - release [created]: a release made by hand in the GitHub UI still auto-
#     publishes. (Releases created by release.yml run under GITHUB_TOKEN, which
#     by design does NOT fire this event — that's why release.yml calls us
#     directly via workflow_call instead of relying on it.)
#
# Required secret: NPM_TOKEN (npm automation token with publish access).

on:
  workflow_call:
    inputs:
      tag:
        description: "The v* tag to publish (e.g. v1.1.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "The v* tag to publish (e.g. v1.1.0)"
        required: true
        type: string
  release:
    types: [created]

permissions:
  contents: read
  id-token: write # Required for provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Resolve the tag from whichever trigger fired.
      - name: Resolve tag
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${RELEASE_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag to publish (neither a release tag nor an input tag was provided)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Check out the tag's exact commit (not the branch head).
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a vX.Y.Z semantic version."
            exit 1
          fi
          # Write the tag's version into package.json (no commit, no git tag).
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm points at ~/.npm/_logs/*.log on failure, but the runner is destroyed
      # with the job, so that path is unreadable by the time anyone looks. Keep
      # the log as an artifact instead. Tokens are redacted in these logs, and
      # Actions masks secrets in artifacts, but the collection step still greps
      # out any authToken line as a belt-and-braces measure.
      - name: Upload npm debug log
        if: failure()
        run: |
          mkdir -p "${{ runner.temp }}/npm-logs"
          if compgen -G "$HOME/.npm/_logs/*.log" > /dev/null; then
            for f in "$HOME"/.npm/_logs/*.log; do
              grep -v -i "authToken" "$f" > "${{ runner.temp }}/npm-logs/$(basename "$f")" || true
            done
          else
            echo "No npm debug logs were written." > "${{ runner.temp }}/npm-logs/none.txt"
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: npm-debug-log
          path: ${{ runner.temp }}/npm-logs
          retention-days: 14
